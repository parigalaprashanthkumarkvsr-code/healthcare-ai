<div class="wrap">
  <div class="eyebrow">Healthcare AI · FIG_005</div>
  <h1>The federated learning loop</h1>
  <p class="cap">Data never leaves each hospital; only model updates travel, are securely aggregated, and return.</p>
  <div class="plate">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-labelledby="federated-loop-title federated-loop-desc">
  <title id="federated-loop-title">The federated learning loop</title>
  <desc id="federated-loop-desc">Hospitals train locally and share only model updates, which are securely aggregated into a new global model each round.</desc>
  <style>
      :root{--dg-paper:#fafaf5;--dg-surface:#f3f1e8;--dg-ink:#1a1a1a;--dg-soft:#4a4a4a;--dg-mute:#6f6f68;--dg-rule:#d9d6c8;--dg-accent:#3553ff;--dg-tint:rgba(53,83,255,0.10);}

    <marker id="federated-loop-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-accent)"/></marker>
  </defs>
  <rect width="1120" height="640" fill="var(--dg-paper)"/>
<rect x="460" y="60" width="200" height="84" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>

<text class="dg-mono" x="560.0" y="114" font-size="10" letter-spacing="0.04em" text-anchor="middle" fill="var(--dg-mute)">server → global model</text>

<text class="dg-mono" x="900.0" y="304" font-size="10" letter-spacing="0.04em" text-anchor="middle" fill="var(--dg-mute)">each hospital</text>
<text class="dg-mono" x="900.0" y="320" font-size="10" letter-spacing="0.04em" text-anchor="middle" fill="var(--dg-mute)">data never moves</text>

<text class="dg-mono" x="380.0" y="494" font-size="10" letter-spacing="0.04em" text-anchor="middle" fill="var(--dg-mute)">secure sum of updates</text>

<rect x="120" y="250" width="200" height="84" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>

<path d="M660 102 H892 A8 8 0 0 1 900 110 V242" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#federated-loop-arw)"/>

<path d="M900 334 V378 A8 8 0 0 1 892 386 H748 A8 8 0 0 0 740 394 V432" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#federated-loop-arw)"/>

<path d="M640 482 H488" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#federated-loop-arw)"/>

<path d="M280 482 H228 A8 8 0 0 1 220 474 V342" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#federated-loop-arw)"/>

<path d="M220 250 V110 A8 8 0 0 1 228 102 H452" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#federated-loop-arw)"/>

<text class="dg-it" x="560" y="296" font-size="15" text-anchor="middle" fill="var(--dg-accent)">patient data never leaves the site —</text>
<text class="dg-it" x="560" y="320" font-size="15" text-anchor="middle" fill="var(--dg-accent)">only model updates travel.</text>
<text class="dg-mono" x="560" y="580" font-size="10" letter-spacing="0.06em" text-anchor="middle" fill="var(--dg-mute)">STANDING CAVEATS: NON-IID SITES · GRADIENT-INVERSION ATTACKS · DIFFERENTIAL PRIVACY BUDGET ε</text>
