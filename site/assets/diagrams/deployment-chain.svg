<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="deployment-chain-title deployment-chain-desc">
  <title id="deployment-chain-title">The responsible deployment chain</title>
  <desc id="deployment-chain-desc">A model moves through validation, shadow mode, and staged rollout into monitored operation, under continuous governance.</desc>
  <style>
      :root{--dg-paper:#fafaf5;--dg-surface:#f3f1e8;--dg-ink:#1a1a1a;--dg-soft:#4a4a4a;--dg-mute:#6f6f68;--dg-rule:#d9d6c8;--dg-accent:#3553ff;--dg-tint:rgba(53,83,255,0.10);}
      :root[data-theme="dark"]{--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}}

      .dg-nm{font-family:'Source Serif 4',Georgia,serif;font-weight:600;}
      .dg-it{font-family:'Source Serif 4',Georgia,serif;font-style:italic;}
      .dg-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
    </style>
  <defs>
    <marker id="deployment-chain-arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-mute)"/></marker>
    <marker id="deployment-chain-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-accent)"/></marker>
  </defs>
  <rect width="1200" height="520" fill="var(--dg-paper)"/>
<rect x="40" y="110" width="188" height="140" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-mono" x="60" y="140" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">01</text>
<text class="dg-nm" x="60" y="170" font-size="15" fill="var(--dg-ink)">LOCAL VALIDATION</text>
<text class="dg-mono" x="60" y="198" font-size="10" fill="var(--dg-mute)">this hospital's data</text>
<text class="dg-mono" x="60" y="216" font-size="10" fill="var(--dg-mute)">per-subgroup metrics</text>
<path d="M232 180 H252" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#deployment-chain-arw)"/>

<path d="M134 250 V322" stroke="var(--dg-rule)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="264" y="110" width="188" height="140" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-mono" x="284" y="140" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">02</text>
<text class="dg-nm" x="284" y="170" font-size="15" fill="var(--dg-ink)">SHADOW MODE</text>
<text class="dg-mono" x="284" y="198" font-size="10" fill="var(--dg-mute)">silent parallel run</text>
<text class="dg-mono" x="284" y="216" font-size="10" fill="var(--dg-mute)">compare vs outcomes</text>
<path d="M456 180 H476" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#deployment-chain-arw)"/>

<path d="M358 250 V322" stroke="var(--dg-rule)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="488" y="110" width="188" height="140" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-mono" x="508" y="140" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">03</text>
<text class="dg-nm" x="508" y="170" font-size="15" fill="var(--dg-ink)">STAGED ROLLOUT</text>
<text class="dg-mono" x="508" y="198" font-size="10" fill="var(--dg-mute)">unit → service → site</text>
<text class="dg-mono" x="508" y="216" font-size="10" fill="var(--dg-mute)">rollback plan</text>
<path d="M680 180 H700" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#deployment-chain-arw)"/>

<path d="M582 250 V322" stroke="var(--dg-rule)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="712" y="110" width="188" height="140" rx="6" fill="var(--dg-tint)" stroke="var(--dg-accent)" stroke-width="1.2"/>
<text class="dg-mono" x="732" y="140" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">04</text>
<text class="dg-nm" x="732" y="170" font-size="15" fill="var(--dg-ink)">MONITORED OPERATION</text>
<text class="dg-mono" x="732" y="198" font-size="10" fill="var(--dg-mute)">drift · equity · incidents</text>
<text class="dg-mono" x="732" y="216" font-size="10" fill="var(--dg-mute)">model card live</text>
<path d="M904 180 H924" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#deployment-chain-arw)"/>

<path d="M806 250 V322" stroke="var(--dg-rule)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="936" y="110" width="188" height="140" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-mono" x="956" y="140" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">05</text>
<text class="dg-nm" x="956" y="170" font-size="15" fill="var(--dg-ink)">RETIREMENT</text>
<text class="dg-mono" x="956" y="198" font-size="10" fill="var(--dg-mute)">committee decision</text>
<text class="dg-mono" x="956" y="216" font-size="10" fill="var(--dg-mute)">replaced or retired</text>
<path d="M1030 250 V322" stroke="var(--dg-rule)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="40" y="330" width="1084" height="72" rx="6" fill="var(--dg-tint)" stroke="var(--dg-accent)" stroke-width="1.2"/>
<text class="dg-nm" x="64" y="360" font-size="16" fill="var(--dg-ink)">GOVERNANCE — CONTINUOUS</text>
<text class="dg-mono" x="64" y="384" font-size="11" fill="var(--dg-mute)">AI committee · thresholds · versioning · incident review · model cards</text>
<text class="dg-it" x="40" y="456" font-size="14" fill="var(--dg-soft)">Trust is an operational property: earned by validation, preserved by monitoring, governed by people whose names are on the decision.</text>
</svg>
