<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="ai-ml-dl-title ai-ml-dl-desc">
  <title id="ai-ml-dl-title">AI, ML, and deep learning, nested</title>
  <desc id="ai-ml-dl-desc">Deep learning sits inside machine learning, which sits inside the broader field of artificial intelligence.</desc>
  <style>
      :root{--dg-paper:#fafaf5;--dg-surface:#f3f1e8;--dg-ink:#1a1a1a;--dg-soft:#4a4a4a;--dg-mute:#6f6f68;--dg-rule:#d9d6c8;--dg-accent:#3553ff;--dg-tint:rgba(53,83,255,0.10);}
      :root[data-theme="dark"]{--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}}

      .dg-nm{font-family:'Source Serif 4',Georgia,serif;font-weight:600;}
      .dg-it{font-family:'Source Serif 4',Georgia,serif;font-style:italic;}
      .dg-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
    </style>
  <defs>
    <marker id="ai-ml-dl-arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-mute)"/></marker>
    <marker id="ai-ml-dl-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-accent)"/></marker>
  </defs>
  <rect width="1120" height="600" fill="var(--dg-paper)"/>
<rect x="40" y="90" width="1040" height="440" rx="8" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.5"/>
<text class="dg-nm" x="70" y="124" font-size="18" fill="var(--dg-ink)">ARTIFICIAL INTELLIGENCE</text>
<text class="dg-mono" x="70" y="146" font-size="11" fill="var(--dg-mute)">the whole umbrella · includes hand-coded rules (MYCIN, 1970s)</text>
<rect x="120" y="176" width="840" height="310" rx="8" fill="var(--dg-paper)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-nm" x="150" y="210" font-size="17" fill="var(--dg-ink)">MACHINE LEARNING</text>
<text class="dg-mono" x="150" y="232" font-size="11" fill="var(--dg-mute)">learns patterns from data · logistic regression · gradient boosting · survival models</text>
<rect x="280" y="278" width="560" height="170" rx="8" fill="var(--dg-tint)" stroke="var(--dg-accent)" stroke-width="1.5"/>
<text class="dg-nm" x="310" y="312" font-size="17" fill="var(--dg-ink)">DEEP LEARNING</text>
<text class="dg-mono" x="310" y="334" font-size="11" fill="var(--dg-mute)">learns representations from raw pixels · signals · text</text>
<rect x="310" y="358" width="150" height="56" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="385.0" y="384" font-size="14" text-anchor="middle" fill="var(--dg-ink)">CNN</text>
<text class="dg-mono" x="385.0" y="404" font-size="10" text-anchor="middle" fill="var(--dg-mute)">imaging</text>

<rect x="485" y="358" width="150" height="56" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="560.0" y="384" font-size="14" text-anchor="middle" fill="var(--dg-ink)">LSTM</text>
<text class="dg-mono" x="560.0" y="404" font-size="10" text-anchor="middle" fill="var(--dg-mute)">trajectories</text>

<rect x="660" y="358" width="150" height="56" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="735.0" y="384" font-size="14" text-anchor="middle" fill="var(--dg-ink)">LLM</text>
<text class="dg-mono" x="735.0" y="404" font-size="10" text-anchor="middle" fill="var(--dg-mute)">notes · genomics</text>

<text class="dg-it" x="40" y="572" font-size="14" fill="var(--dg-soft)">Nested, not interchangeable — each family answers a different question with different data requirements.</text>
</svg>
