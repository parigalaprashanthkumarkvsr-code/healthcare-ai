<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="clinical-data-ecosystem-title clinical-data-ecosystem-desc">
  <title id="clinical-data-ecosystem-title">The clinical data ecosystem</title>
  <desc id="clinical-data-ecosystem-desc">Clinical data sources flow through shared standards and governed infrastructure into decision support and machine learning.</desc>
  <style>
      :root{--dg-paper:#fafaf5;--dg-surface:#f3f1e8;--dg-ink:#1a1a1a;--dg-soft:#4a4a4a;--dg-mute:#6f6f68;--dg-rule:#d9d6c8;--dg-accent:#3553ff;--dg-tint:rgba(53,83,255,0.10);}
      :root[data-theme="dark"]{--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}
      @media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="dark"]){--dg-paper:#0a0d1a;--dg-surface:#131830;--dg-ink:#e8e6dc;--dg-soft:#c9c7bd;--dg-mute:#8f8d86;--dg-rule:#2b3252;--dg-accent:#6b8eff;--dg-tint:rgba(107,142,255,0.18);}}

      .dg-nm{font-family:'Source Serif 4',Georgia,serif;font-weight:600;}
      .dg-it{font-family:'Source Serif 4',Georgia,serif;font-style:italic;}
      .dg-mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
    </style>
  <defs>
    <marker id="clinical-data-ecosystem-arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-mute)"/></marker>
    <marker id="clinical-data-ecosystem-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--dg-accent)"/></marker>
  </defs>
  <rect width="1120" height="660" fill="var(--dg-paper)"/>
<text class="dg-mono" x="40" y="58" font-size="10" letter-spacing="0.14em" fill="var(--dg-accent)">01 · SOURCES — WHAT CLINICAL CARE GENERATES</text>
<rect x="40" y="70" width="188" height="60" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="134.0" y="96" font-size="14" text-anchor="middle" fill="var(--dg-ink)">EHR</text>
<text class="dg-mono" x="134.0" y="116" font-size="10" text-anchor="middle" fill="var(--dg-mute)">FHIR resources</text>

<rect x="248" y="70" width="188" height="60" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="342.0" y="96" font-size="14" text-anchor="middle" fill="var(--dg-ink)">IMAGING</text>
<text class="dg-mono" x="342.0" y="116" font-size="10" text-anchor="middle" fill="var(--dg-mute)">DICOM · PACS</text>

<rect x="456" y="70" width="188" height="60" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="550.0" y="96" font-size="14" text-anchor="middle" fill="var(--dg-ink)">SIGNALS</text>
<text class="dg-mono" x="550.0" y="116" font-size="10" text-anchor="middle" fill="var(--dg-mute)">ECG · EEG · PPG</text>

<rect x="664" y="70" width="188" height="60" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="758.0" y="96" font-size="14" text-anchor="middle" fill="var(--dg-ink)">GENOMICS</text>
<text class="dg-mono" x="758.0" y="116" font-size="10" text-anchor="middle" fill="var(--dg-mute)">FASTQ → VCF</text>

<rect x="872" y="70" width="188" height="60" rx="6" fill="var(--dg-surface)" stroke="var(--dg-rule)" stroke-width="1"/>
<text class="dg-nm" x="966.0" y="96" font-size="14" text-anchor="middle" fill="var(--dg-ink)">NOTES</text>
<text class="dg-mono" x="966.0" y="116" font-size="10" text-anchor="middle" fill="var(--dg-mute)">free text · NLP</text>

<path d="M540 138 V204" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#clinical-data-ecosystem-arw)"/>
<rect x="582" y="166" width="115" height="14" fill="var(--dg-paper)"/>
<text class="dg-mono" x="640" y="177" font-size="10" letter-spacing="0.06em" text-anchor="middle" fill="var(--dg-soft)">standards apply</text>

<rect x="40" y="212" width="1020" height="64" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-nm" x="64" y="240" font-size="16" fill="var(--dg-ink)">02 · STANDARDS &amp; TERMINOLOGY</text>
<text class="dg-mono" x="64" y="262" font-size="11" fill="var(--dg-mute)">HL7 v2 · FHIR · DICOM · ICD · SNOMED CT · LOINC · RxNorm</text>
<path d="M540 284 V328" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#clinical-data-ecosystem-arw)"/>
<rect x="566" y="302" width="188" height="14" fill="var(--dg-paper)"/>
<text class="dg-mono" x="660" y="313" font-size="10" letter-spacing="0.06em" text-anchor="middle" fill="var(--dg-soft)">join on patient identifier</text>

<rect x="40" y="336" width="1020" height="64" rx="6" fill="var(--dg-tint)" stroke="var(--dg-accent)" stroke-width="1.2"/>
<text class="dg-nm" x="64" y="364" font-size="16" fill="var(--dg-ink)">03 · INFRASTRUCTURE</text>
<text class="dg-mono" x="64" y="386" font-size="11" fill="var(--dg-mute)">warehouse / lake · de-identification · access governance</text>
<path d="M540 408 V456" fill="none" stroke="var(--dg-mute)" stroke-width="1.5" marker-end="url(#clinical-data-ecosystem-arw)"/>

<rect x="40" y="464" width="1020" height="64" rx="6" fill="var(--dg-surface)" stroke="var(--dg-ink)" stroke-width="1.2"/>
<text class="dg-nm" x="64" y="492" font-size="16" fill="var(--dg-ink)">04 · CONSUMERS</text>
<text class="dg-mono" x="64" y="514" font-size="11" fill="var(--dg-mute)">CDSS at the bedside · ML training · population dashboards</text>
<text class="dg-it" x="40" y="576" font-size="14" fill="var(--dg-soft)">Every movement of the joined data is a compliance decision — HIPAA and GDPR govern each arrow.</text>
<rect x="40" y="610" width="18" height="12" rx="3" fill="var(--dg-surface)" stroke="var(--dg-rule)"/>
<text class="dg-mono" x="66" y="620" font-size="10" fill="var(--dg-mute)">data source</text>
<rect x="178.6" y="610" width="18" height="12" rx="3" fill="var(--dg-surface)" stroke="var(--dg-ink)"/>
<text class="dg-mono" x="204.6" y="620" font-size="10" fill="var(--dg-mute)">shared layer</text>
<rect x="323.79999999999995" y="610" width="18" height="12" rx="3" fill="var(--dg-tint)" stroke="var(--dg-accent)"/>
<text class="dg-mono" x="349.79999999999995" y="620" font-size="10" fill="var(--dg-mute)">governed boundary</text>

</svg>
